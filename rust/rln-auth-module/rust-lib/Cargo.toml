[package]
name = "rln_auth_module"
version = "0.2.1"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
auth_vector = { git = "https://github.com/logos-co/logos-paymaster-crates", rev = "52b842352d68c66e84858e4e98f952cb0ab4537f" }
auth_vectors = { git = "https://github.com/logos-co/logos-paymaster-crates", rev = "52b842352d68c66e84858e4e98f952cb0ab4537f", default-features = false, features = ["verify"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
hex = "0.4"
auth_vectors = { git = "https://github.com/logos-co/logos-paymaster-crates", rev = "52b842352d68c66e84858e4e98f952cb0ab4537f", default-features = false, features = ["verify", "sign"] }

[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
# Ownership and borrowing in signatures
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
ptr_arg = "warn"
borrowed_box = "warn"
# Clones and allocations
implicit_clone = "warn"
unnecessary_to_owned = "warn"
iter_overeager_cloned = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
# Smart pointers and shared state
rc_buffer = "warn"
rc_mutex = "warn"
arc_with_non_send_sync = "warn"
mutex_atomic = "warn"
redundant_allocation = "warn"
box_collection = "warn"
unnecessary_box_returns = "warn"
large_enum_variant = "warn"
await_holding_lock = "warn"
# Lifetimes
needless_lifetimes = "warn"
extra_unused_lifetimes = "warn"
# Escape hatches stay documented
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
