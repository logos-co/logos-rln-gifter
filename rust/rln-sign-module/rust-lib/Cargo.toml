[package]
name = "rln_sign_module"
version = "0.2.1"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rln_auth_vector = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.1", package = "rln_auth_vector" }
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.1", package = "rln_auth_vectors", default-features = false, features = ["sign"] }
zksign_light = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.1", package = "zksign_light", default-features = false, features = ["client"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }

[dev-dependencies]
base58 = "0.2"
rln_auth_vectors = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "auth-crates-v0.3.1", package = "rln_auth_vectors", default-features = false, features = ["sign", "verify"] }

[lints.rust]
unused_lifetimes = "warn"

[lints.clippy]
# Ownership and borrowing in signatures
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
ref_option = "warn"
ptr_arg = "warn"
borrowed_box = "warn"
# Clones and allocations
implicit_clone = "warn"
unnecessary_to_owned = "warn"
iter_overeager_cloned = "warn"
cloned_instead_of_copied = "warn"
assigning_clones = "warn"
clone_on_ref_ptr = "warn"
# Smart pointers and shared state
rc_buffer = "warn"
rc_mutex = "warn"
arc_with_non_send_sync = "warn"
mutex_atomic = "warn"
redundant_allocation = "warn"
box_collection = "warn"
unnecessary_box_returns = "warn"
large_enum_variant = "warn"
await_holding_lock = "warn"
# Lifetimes
needless_lifetimes = "warn"
extra_unused_lifetimes = "warn"
# Escape hatches stay documented
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
