[package]
name = "keycard_capture_module"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
crate-type = ["staticlib"]

[profile.release]
panic = "abort"

[dependencies]
serde_json = "1"
hex = "0.4"
keycard_attest = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "keycard-crates-v0.1.0", package = "keycard_attest" }
keycard_client = { git = "https://github.com/logos-co/logos-rln-gifter", tag = "keycard-crates-v0.1.0", package = "keycard_client" }
logos-rust-sdk = { path = "../logos-rust-sdk-src" }
