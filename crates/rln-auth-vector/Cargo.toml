[package]
name = "rln_auth_vector"
version = "0.1.0"
edition = "2021"
description = "Contract kit for RLN gifter auth vectors: request/reply types, the AuthVector trait, and dispatch glue shared by the gifter modules and vector plugins"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
